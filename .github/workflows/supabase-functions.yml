name: Deploy Supabase functions

# Deploys the edge functions in supabase/functions to the linked project when
# they (or this workflow) change on main. The AI Quality run engine (`run-eval`)
# needs ANTHROPIC_API_KEY set on the project — this workflow syncs it from a
# GitHub Actions secret so the key never lives in the repo.
#
# Set these in GitHub → repo Settings → Secrets and variables → Actions:
#   Variable  SUPABASE_PROJECT_REF   your project ref (public; it's in the API URL)
#   Secret    SUPABASE_ACCESS_TOKEN  Account → Access Tokens
#   Secret    ANTHROPIC_API_KEY      your Anthropic API key (server-only)
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the project ref isn't configured
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Set the SUPABASE_PROJECT_REF repository variable (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync ANTHROPIC_API_KEY function secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "::warning::ANTHROPIC_API_KEY secret is not set — run-eval will return 500 until you set it (supabase secrets set ANTHROPIC_API_KEY=...)."
          fi

      - name: Deploy run-eval
        run: supabase functions deploy run-eval --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy features
        run: supabase functions deploy features --project-ref "$SUPABASE_PROJECT_REF"
